<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E498" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8822" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="20" fill="#050505" />
  
  <!-- Jar outline -->
  <path d="M35 30 L65 30 M40 30 L40 25 C40 22, 42 20, 45 20 L55 20 C58 20, 60 22, 60 25 L60 30 M30 35 L70 35 C72 35, 75 38, 75 42 L70 80 C69 85, 65 88, 60 88 L40 88 C35 88, 31 85, 30 80 L25 42 C25 38, 28 35, 30 35 Z" 
        fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round" />
        
  <!-- Coin in the middle -->
  <circle cx="50" cy="60" r="12" fill="url(#gold)" filter="url(#shadow)" />
  <text x="50" y="65" font-family="Montserrat, sans-serif" font-weight="900" font-size="12" fill="#050505" text-anchor="middle">$</text>
  
  <!-- Lid accent -->
  <rect x="35" y="30" width="30" height="5" fill="url(#gold)" rx="2" />
</svg>
